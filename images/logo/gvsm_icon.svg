<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="icon-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#111c26"/>
      <stop offset="100%" stop-color="#06090d"/>
    </radialGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Blueprint Cyan -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Titanium Metal -->
    <linearGradient id="ti-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="108" fill="url(#icon-bg)"/>
  <rect width="512" height="512" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- ======================================================== -->
  <!-- ISOMETRIC SPATIAL GROUNDING PRISM EMBLEM                 -->
  <!-- ======================================================== -->
  <g transform="translate(256, 215) scale(1.55)" filter="url(#icon-shadow)">
    <!-- Top Face (Coordinate Plane) -->
    <polygon points="0,-95 75,-52 0,-9 -75,-52" 
      fill="#1e293b" 
      stroke="url(#cyan-grad)" 
      stroke-width="3.5" 
      stroke-linejoin="round"/>
    
    <!-- Top Grid Lines -->
    <line x1="-38" y1="-73" x2="37" y2="-30" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="38" y1="-73" x2="-37" y2="-30" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Left Face (Blueprint Wireframe Framing) -->
    <polygon points="-75,-52 0,-9 0,78 -75,35" 
      fill="#09131d" 
      stroke="url(#cyan-grad)" 
      stroke-width="3.5" 
      stroke-linejoin="round"/>
    
    <!-- Framing Studs inside Left Face -->
    <line x1="-50" y1="-38" x2="-50" y2="49" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="-25" y1="-23" x2="-25" y2="64" stroke="#0284c7" stroke-width="2.5"/>

    <!-- Right Face (Finished Solid Model) -->
    <polygon points="0,-9 75,-52 75,35 0,78" 
      fill="url(#emerald-grad)" 
      stroke="#10b981" 
      stroke-width="3.5" 
      stroke-linejoin="round"/>

    <!-- 45-degree Cutaway Line -->
    <line x1="0" y1="-95" x2="0" y2="78" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Center Laser Sight / Ground Truth Vertex -->
    <circle cx="0" cy="-9" r="8" fill="#070a0e" stroke="#34d399" stroke-width="3.5"/>
    <circle cx="0" cy="-9" r="3.5" fill="#ffffff"/>
  </g>

  <!-- ======================================================== -->
  <!-- BOLD MONOGRAM TYPOGRAPHY                                  -->
  <!-- ======================================================== -->
  <g transform="translate(256, 420)">
    <text x="0" y="0" 
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
      font-size="64" 
      font-weight="900" 
      letter-spacing="4px" 
      fill="url(#ti-grad)">G<tspan fill="url(#emerald-grad)">V</tspan>SM</text>
    
    <text x="0" y="32" 
      text-anchor="middle"
      font-family="monospace" 
      font-size="13" 
      font-weight="700" 
      letter-spacing="3.5px" 
      fill="#64748b">GROUND TRUTH</text>
  </g>
</svg>
