<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 580" width="100%" height="100%">
  <defs>
    <!-- Heavy Forged Brass / Bronze Gradient (Rich Warmth) -->
    <radialGradient id="brass-body" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="15%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="85%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3d1a04"/>
    </radialGradient>

    <!-- Stamped Gold Bevel Highlight -->
    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Deep Carbon Slate Instrument Dial -->
    <radialGradient id="carbon-dial" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0c1220"/>
      <stop offset="85%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Polished Chiseled Titanium Gradient for GVSM -->
    <linearGradient id="ti-solid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Vibrant Emerald Laser Gradient -->
    <linearGradient id="emerald-laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Deep Drop Shadow for Heavy Physical Weight -->
    <filter id="seal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Laser Glow Filter -->
    <filter id="laser-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text Chisel Shadow -->
    <filter id="chisel-emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="0.8" flood-color="#fef08a" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="-1.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#seal-shadow)" transform="translate(290, 290)">
    
    <!-- ======================================================== -->
    <!-- 1. HEAVY FORGED BRASS SURVEY BENCHMARK MEDALLION         -->
    <!-- ======================================================== -->
    <!-- Outer Heavy Rim Base (Radius 268) -->
    <circle cx="0" cy="0" r="268" fill="url(#brass-body)" stroke="#1c1917" stroke-width="3"/>
    
    <!-- Minted Coin-Edge / Knurled Rim (180 precision teeth) -->
    <circle cx="0" cy="0" r="262" fill="none" stroke="#3d1a04" stroke-width="5" stroke-dasharray="2.5, 2"/>
    <circle cx="0" cy="0" r="259" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.85"/>
    <circle cx="0" cy="0" r="256" fill="none" stroke="#78350f" stroke-width="1.5"/>

    <!-- Deep Recessed Stamped Channel for Text (Radius 254 to 184) -->
    <circle cx="0" cy="0" r="184" fill="url(#gold-bevel)" stroke="#271002" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.7"/>

    <!-- ======================================================== -->
    <!-- 2. STAMPED CIRCULAR TEXT ON BRASS COLLAR                 -->
    <!-- ======================================================== -->
    <!-- Top Arc: GROUNDED VISUAL SITE MODELING (Radius 220) -->
    <path id="top-arc" d="M -220 0 A 220 220 0 0 1 220 0" fill="none"/>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="19.5" 
          font-weight="900" 
          letter-spacing="5.5px" 
          fill="#1c1917"
          filter="url(#chisel-emboss)">
      <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
        GROUNDED VISUAL SITE MODELING
      </textPath>
    </text>

    <!-- Bottom Arc: DONDLINGER GC (Radius 222, RIGHT SIDE UP) -->
    <path id="bot-arc" d="M -192 110 A 222 222 0 0 0 192 110" fill="none"/>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="18.5" 
          font-weight="900" 
          letter-spacing="6px" 
          fill="#1c1917"
          filter="url(#chisel-emboss)">
      <textPath href="#bot-arc" startOffset="50%" text-anchor="middle">
        ★ DONDLINGER GC ★
      </textPath>
    </text>

    <!-- Precision Machined Hex Bolts at 9 and 3 o'clock -->
    <g transform="translate(-220, 0)">
      <circle cx="0" cy="0" r="9" fill="#1c1917" stroke="#fef08a" stroke-width="1.5"/>
      <polygon points="0,-4.5 4,-2.2 4,2.2 0,4.5 -4,2.2 -4,-2.2" fill="#78350f" stroke="#fef08a" stroke-width="0.8"/>
    </g>
    <g transform="translate(220, 0)">
      <circle cx="0" cy="0" r="9" fill="#1c1917" stroke="#fef08a" stroke-width="1.5"/>
      <polygon points="0,-4.5 4,-2.2 4,2.2 0,4.5 -4,2.2 -4,-2.2" fill="#78350f" stroke="#fef08a" stroke-width="0.8"/>
    </g>

    <!-- ======================================================== -->
    <!-- 3. INNER TRANSIT BEZEL & INSTRUMENT DIAL FACE            -->
    <!-- ======================================================== -->
    <!-- Stepped Inner Bezel (Radius 176) -->
    <circle cx="0" cy="0" r="176" fill="url(#carbon-dial)" stroke="#1e293b" stroke-width="3"/>
    <circle cx="0" cy="0" r="172" fill="none" stroke="#334155" stroke-width="1.2"/>

    <!-- 360-Degree Azimuth Transit Hash Marks (Every 15 deg) -->
    <g stroke="#475569" stroke-width="1.5" opacity="0.85">
      <!-- 0° / North (Emerald Arrow & Long Tick) -->
      <line x1="0" y1="-172" x2="0" y2="-158" stroke="#10b981" stroke-width="2.2"/>
      <polygon points="0,-154 -6,-144 6,-144" fill="#10b981"/>
      <text x="0" y="-134" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#10b981">0°</text>

      <!-- 15° -->
      <line x1="44" y1="-166" x2="41" y2="-156"/>
      <!-- 30° -->
      <line x1="86" y1="-149" x2="80" y2="-139" stroke="#94a3b8" stroke-width="2"/>
      <text x="74" y="-127" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#64748b">30°</text>
      <!-- 45° -->
      <line x1="121.6" y1="-121.6" x2="114" y2="-114"/>
      <!-- 60° -->
      <line x1="149" y1="-86" x2="139" y2="-80" stroke="#94a3b8" stroke-width="2"/>
      <text x="127" y="-72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#64748b">60°</text>
      <!-- 75° -->
      <line x1="166" y1="-44" x2="156" y2="-41"/>

      <!-- 90° / East -->
      <line x1="172" y1="0" x2="158" y2="0" stroke="#10b981" stroke-width="2.2"/>
      <text x="146" y="3" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#10b981">90°</text>

      <!-- 105° -->
      <line x1="166" y1="44" x2="156" y2="41"/>
      <!-- 120° -->
      <line x1="149" y1="86" x2="139" y2="80" stroke="#94a3b8" stroke-width="2"/>
      <!-- 135° -->
      <line x1="121.6" y1="121.6" x2="114" y2="114"/>
      <!-- 150° -->
      <line x1="86" y1="149" x2="80" y2="139" stroke="#94a3b8" stroke-width="2"/>
      <!-- 165° -->
      <line x1="44" y1="166" x2="41" y2="156"/>

      <!-- 180° / South -->
      <line x1="0" y1="172" x2="0" y2="158" stroke="#10b981" stroke-width="2.2"/>
      <text x="0" y="152" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#10b981">180°</text>

      <!-- 195° -->
      <line x1="-44" y1="166" x2="-41" y2="156"/>
      <!-- 210° -->
      <line x1="-86" y1="149" x2="-80" y2="139" stroke="#94a3b8" stroke-width="2"/>
      <!-- 225° -->
      <line x1="-121.6" y1="121.6" x2="-114" y2="114"/>
      <!-- 240° -->
      <line x1="-149" y1="86" x2="-139" y2="80" stroke="#94a3b8" stroke-width="2"/>
      <!-- 255° -->
      <line x1="-166" y1="44" x2="-156" y2="41"/>

      <!-- 270° / West -->
      <line x1="-172" y1="0" x2="-158" y2="0" stroke="#10b981" stroke-width="2.2"/>
      <text x="-144" y="3" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#10b981">270°</text>

      <!-- 285° -->
      <line x1="-166" y1="-44" x2="-156" y2="-41"/>
      <!-- 300° -->
      <line x1="-149" y1="-86" x2="-139" y2="-80" stroke="#94a3b8" stroke-width="2"/>
      <text x="-127" y="-72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#64748b">300°</text>
      <!-- 315° -->
      <line x1="-121.6" y1="-121.6" x2="-114" y2="-114"/>
      <!-- 330° -->
      <line x1="-86" y1="-149" x2="-80" y2="-139" stroke="#94a3b8" stroke-width="2"/>
      <text x="-74" y="-127" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#64748b">330°</text>
      <!-- 345° -->
      <line x1="-44" y1="-166" x2="-41" y2="-156"/>
    </g>

    <!-- Precision Concentric Instrument Reticle Rings -->
    <circle cx="0" cy="0" r="156" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6"/>
    <circle cx="0" cy="0" r="126" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.45"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>

    <!-- ======================================================== -->
    <!-- 4. AUTHENTIC GEODETIC BENCHMARK TRIANGLE & RETICLE (TOP) -->
    <!-- Classic Triangulation Station Survey Mark (NO SQUARES)   -->
    <!-- ======================================================== -->
    <g transform="translate(0, -68)">
      <!-- Circular Optical Target Collar -->
      <circle cx="0" cy="0" r="32" fill="#0b111e" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#334155" stroke-width="0.8"/>

      <!-- 4-Quadrant Optical Alternating Calibration Fill (Classic Target) -->
      <path d="M 0 0 L 28 0 A 28 28 0 0 1 0 28 Z" fill="#10b981" opacity="0.18"/>
      <path d="M 0 0 L -28 0 A 28 28 0 0 1 0 -28 Z" fill="#10b981" opacity="0.18"/>

      <!-- Official Geodetic Triangulation Benchmark Triangle (Heavy Chiseled Titanium) -->
      <polygon points="0,-22 22,14 -22,14" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="0,-16 15,10 -15,10" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.8"/>

      <!-- Center Optical Benchmark Datum Dot (Zero Position) -->
      <circle cx="0" cy="0" r="3.5" fill="#00ff88" filter="url(#laser-glow)"/>
      
      <!-- Optical Crosshairs piercing the Triangle -->
      <line x1="-32" y1="0" x2="-8" y2="0" stroke="#10b981" stroke-width="1.2"/>
      <line x1="8" y1="0" x2="32" y2="0" stroke="#10b981" stroke-width="1.2"/>
      <line x1="0" y1="-32" x2="0" y2="-8" stroke="#10b981" stroke-width="1.2"/>
      <line x1="0" y1="8" x2="0" y2="32" stroke="#10b981" stroke-width="1.2"/>
      
      <!-- Vertical Plumb Line connecting to GVSM -->
      <line x1="0" y1="32" x2="0" y2="52" stroke="#00ff88" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Reticle Horizontal Crosshair Wings (Left & Right of Center) -->
    <g stroke="#334155" stroke-width="1.2">
      <!-- Left Wing with Stadia Ticks -->
      <line x1="-156" y1="26" x2="-98" y2="26"/>
      <line x1="-140" y1="21" x2="-140" y2="31"/>
      <line x1="-120" y1="23" x2="-120" y2="29"/>
      
      <!-- Right Wing with Stadia Ticks -->
      <line x1="98" y1="26" x2="156" y2="26"/>
      <line x1="120" y1="23" x2="120" y2="29"/>
      <line x1="140" y1="21" x2="140" y2="31"/>
    </g>

    <!-- ======================================================== -->
    <!-- 5. MASSIVE, BOLD MONOGRAM: G V S M                       -->
    <!-- Heavy Chiseled Titanium + Emerald Laser V                -->
    <!-- ======================================================== -->
    <g transform="translate(0, 32)">
      <text x="0" y="0" 
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Chakra Petch', Roboto, sans-serif" 
        font-size="76" 
        font-weight="900" 
        letter-spacing="4px" 
        fill="url(#ti-solid)">G<tspan fill="url(#emerald-laser)" filter="url(#laser-glow)">V</tspan>SM</text>
    </g>

    <!-- ======================================================== -->
    <!-- 6. PHOTOGRAMMETRY CALIBRATION SCALE BAR                  -->
    <!-- Alternating Precision Optical Blocks                     -->
    <!-- ======================================================== -->
    <g transform="translate(0, 62)">
      <!-- Black & Titanium Alternating Calibration Blocks -->
      <rect x="-70" y="-3.5" width="140" height="7" fill="#0f172a" stroke="#475569" stroke-width="1.2" rx="1"/>
      <!-- Alternating Silver / Titanium Fill Blocks (14px segments) -->
      <rect x="-70" y="-3" width="14" height="6" fill="#cbd5e1"/>
      <rect x="-42" y="-3" width="14" height="6" fill="#cbd5e1"/>
      <rect x="-14" y="-3" width="14" height="6" fill="url(#emerald-laser)"/>
      <rect x="0" y="-3" width="14" height="6" fill="url(#emerald-laser)"/>
      <rect x="28" y="-3" width="14" height="6" fill="#cbd5e1"/>
      <rect x="56" y="-3" width="14" height="6" fill="#cbd5e1"/>

      <!-- Precision Millimeter Ticks Above & Below -->
      <g stroke="#94a3b8" stroke-width="1">
        <line x1="-70" y1="-7" x2="-70" y2="7" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="-56" y1="-5.5" x2="-56" y2="5.5"/>
        <line x1="-42" y1="-5.5" x2="-42" y2="5.5"/>
        <line x1="-28" y1="-5.5" x2="-28" y2="5.5"/>
        <line x1="-14" y1="-6" x2="-14" y2="6"/>
        <line x1="0" y1="-9" x2="0" y2="9" stroke="#00ff88" stroke-width="2"/>
        <line x1="14" y1="-6" x2="14" y2="6"/>
        <line x1="28" y1="-5.5" x2="28" y2="5.5"/>
        <line x1="42" y1="-5.5" x2="42" y2="5.5"/>
        <line x1="56" y1="-5.5" x2="56" y2="5.5"/>
        <line x1="70" y1="-7" x2="70" y2="7" stroke="#ffffff" stroke-width="1.5"/>
      </g>
    </g>

    <!-- ======================================================== -->
    <!-- 7. STAMPED GEODETIC ORIGIN BADGE                         -->
    <!-- True Hometown Origin: WISCONSIN RAPIDS, WI               -->
    <!-- ======================================================== -->
    <g transform="translate(0, 98)">
      <!-- Machined Plate Base -->
      <rect x="-95" y="-12" width="190" height="24" rx="4" fill="#0b111e" stroke="#334155" stroke-width="1.5"/>
      <rect x="-92" y="-9" width="184" height="18" rx="2" fill="none" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Authentic Origin Text: WISCONSIN RAPIDS, WI -->
      <text x="0" y="4" 
            text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
            font-size="10.5" 
            font-weight="800" 
            letter-spacing="1.8px" 
            fill="#cbd5e1">WISCONSIN RAPIDS, WI</text>
            
          <!-- Corner Precision Hex Rivets -->
          <circle cx="-87" cy="0" r="2" fill="#64748b" stroke="#334155" stroke-width="0.8"/>
          <circle cx="87" cy="0" r="2" fill="#64748b" stroke="#334155" stroke-width="0.8"/>
    </g>

  </g>
</svg>
